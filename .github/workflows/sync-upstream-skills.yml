name: Sync upstream skills

on:
  schedule:
    - cron: '23 8 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test sync behavior
        run: python -m unittest discover -s tests -v
      - name: Fetch latest upstream skills
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync-upstream-skills.py
      - name: Stage imported files and provenance
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path
          manifest = json.loads(Path('upstream/sources.json').read_text())
          paths = [*manifest['skills'].values(), manifest['license'], 'upstream/sources.json']
          subprocess.run(['git', 'add', '--all', '--', *paths], check=True)
      - name: Commit and push changed imports
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --cached --quiet; then
            echo "No imported file changes."
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update vendored upstream skills"
          git push origin "HEAD:$TARGET_BRANCH"
